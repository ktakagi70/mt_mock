<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tear lab #02 · the toolbox · a maskingtape mock</title>
<style>
  :root{
    --paper:#FBFAF6; --ink:#4A443C; --ink-soft:#9A938A;
    --line:#E7E2D8; --accent:#C9662E; --wood:#B98A5A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper);color:var(--ink);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  header{display:flex;align-items:baseline;gap:10px;padding:13px 18px 8px;}
  header h1{font-size:17px;font-weight:700;letter-spacing:.02em;}
  header h1 .tape-mark{
    display:inline-block;background:rgba(232,184,75,.55);
    padding:2px 8px;border-radius:2px;transform:rotate(-1.5deg);
  }
  header .sub{font-size:11.5px;color:var(--ink-soft);}
  .toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:4px 18px 8px;
  }
  .row2{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:0 18px 8px;border-bottom:1px solid var(--line);min-height:34px;
  }
  .modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
  .modes button{
    font-size:12.5px;padding:7px 12px;border:none;background:transparent;color:var(--ink-soft);
    cursor:pointer;font-weight:600;
  }
  .modes button.active{background:var(--ink);color:#fff;}
  .swatches{display:flex;gap:8px;}
  .swatch{width:32px;height:21px;border-radius:2px;border:none;cursor:pointer;transform:rotate(-1deg);opacity:.85;}
  .swatch.active{outline:2px solid var(--ink);outline-offset:2px;opacity:1;}
  .actions{margin-left:auto;display:flex;gap:8px;}
  .actions button,.seg button{
    font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);cursor:pointer;font-weight:600;
  }
  .seg{display:flex;gap:6px;}
  .seg button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  #typeText{
    font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    width:150px;background:#fff;color:var(--ink);
  }
  .rowlabel{font-size:11.5px;color:var(--ink-soft);}
  #stage{flex:1;position:relative;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;}
  .hint{
    position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none;
    font-size:12.5px;color:var(--ink-soft);padding:0 16px;
  }
  .hint b{color:var(--ink);}
  footer{
    padding:7px 18px 11px;font-size:11px;color:var(--ink-soft);
    border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
</style>
</head>
<body>

<header>
  <h1><span class="tape-mark">tear lab #02</span></h1>
  <span class="sub">the toolbox — strange little tools, real torn fibers</span>
</header>

<div class="toolbar">
  <div class="modes">
    <button data-mode="tape" class="active">Tape</button>
    <button data-mode="weight">Weight</button>
    <button data-mode="punch">Punch</button>
    <button data-mode="type">Type</button>
    <button data-mode="move">Move</button>
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="actions">
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save PNG</button>
  </div>
</div>

<div class="row2" id="row2"></div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hint" id="hint"></div>
</div>

<footer>
  <span id="footTip">Hold a tool <b>longer</b> for a careful, clean tear — a <b>quick</b> press rips it fuzzy.</span>
  <span>made with ♡ for maskingtape patrons</span>
</footer>

const cv = document.getElementById("cv");

const stage = document.getElementById("stage");

let DPR = 1, W = 0, H = 0;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
}
window.addEventListener("resize", resize);
resize();

const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1);
const rnd = (a,b) => a + Math.random()*(b-a);

function mkCanvas(w, h){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  return c;
}
function cloneCanvas(c){
  const n = mkCanvas(c.width, c.height);
  n.getContext("2d").drawImage(c, 0, 0);
  return n;
}

  { base:"#F2A9BA", deco:"#E4849C", type:"dot"    },
  { base:"#A5D8C3", deco:"#8CC9B0", type:"plain"  },
  { base:"#9BB5E3", deco:"#7D9DD6", type:"grid"   },
];

const patternCache = {};
function getPattern(i){
  if (patternCache[i]) return patternCache[i];
  const d = DESIGNS[i];
  const pc = mkCanvas(56, 56), p = pc.getContext("2d");
  p.fillStyle = d.base; p.fillRect(0,0,56,56);
  p.fillStyle = d.deco;
  if (d.type === "stripe"){ for (let x = 4; x < 56; x += 14) p.fillRect(x, 0, 5, 56); }
  else if (d.type === "dot"){
    for (let y = 7; y < 56; y += 14)
      for (let x = ((y/14)%2 ? 7 : 14); x < 56; x += 14){ p.beginPath(); p.arc(x,y,3.2,0,7); p.fill(); }
  } else if (d.type === "grid"){
    p.strokeStyle = d.deco; p.lineWidth = 1.4;
    for (let x = 6; x < 56; x += 12){ p.beginPath(); p.moveTo(x,0); p.lineTo(x,56); p.stroke(); }
    for (let y = 6; y < 56; y += 12){ p.beginPath(); p.moveTo(0,y); p.lineTo(56,y); p.stroke(); }
  }
  p.strokeStyle = "rgba(255,255,255,0.28)"; p.lineWidth = 0.8;
  for (let k = 0; k < 22; k++){
    const y = Math.random()*56, x = Math.random()*56, len = 6+Math.random()*16;
    p.beginPath(); p.moveTo(x,y); p.lineTo(x+len, y+(Math.random()-0.5)*1.5); p.stroke();
  }
  patternCache[i] = ctx.createPattern(pc, "repeat");
  return patternCache[i];
}

/* keba scale: k=0 clean … k=1 fuzzy */
function kFromHold(ms){ return 1 - clamp((ms - 150) / 600, 0, 1); }
function kFromSpeed(s){ return clamp((s - 0.3) / 1.2, 0, 1); }
function kLabel(k){
  if (k > 0.66) return "quick rip — extra fuzzy";
  if (k > 0.33) return "steady tear";
  return "careful press — clean edge";
}

/* ================= raster cut pipeline ================= */
function alphaOf(c){
  return c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
}
function aAt(data, w, h, x, y){
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= w || y >= h) return 0;
  return data[(y * w + x) * 4 + 3];
}

/* boundary points of mask that cut through real tape material */
function cutBoundary(maskData, preData, w, h){
  const pts = [];
  for (let y = 4; y < h - 4; y += 2){
    for (let x = 4; x < w - 4; x += 2){
      const i = (y * w + x) * 4 + 3;
      const a = maskData[i];
      if (a < 128) continue;
      if (maskData[i - 8] >= 128 && maskData[i + 8] >= 128 &&
          maskData[i - 8 * w] >= 128 && maskData[i + 8 * w] >= 128) continue;
      let gx = aAt(maskData, w, h, x + 3, y) - aAt(maskData, w, h, x - 3, y);
      let gy = aAt(maskData, w, h, x, y + 3) - aAt(maskData, w, h, x, y - 3);
      const gl = Math.hypot(gx, gy);
      if (gl < 10) continue;
      gx /= gl; gy /= gl;               // points INTO the mask
      if (aAt(preData, w, h, x + gx * 5, y + gy * 5) < 12) continue;
      if (aAt(preData, w, h, x - gx * 5, y - gy * 5) < 12) continue;
      pts.push({ x, y, gx, gy });
    }
  }
  return pts;
}

function roughenMask(mctx, pts, k){
  const n = Math.round(pts.length * 0.25);
  for (let i = 0; i < n; i++){
    const p = pts[Math.floor(Math.random() * pts.length)];
    const r = rnd(0.5, 1.2) * lerp(0.8, 2.0, k);
    mctx.globalCompositeOperation = Math.random() < 0.5 ? "destination-out" : "source-over";
    mctx.fillStyle = "#fff";
    mctx.beginPath();
    mctx.arc(p.x + rnd(-1.5, 1.5), p.y + rnd(-1.5, 1.5), r, 0, 7);
    mctx.fill();
  }
  mctx.globalCompositeOperation = "source-over";
}

function stampFibers(fctx, pts, sign, k, tx, ty){
  if (!pts.length) return;
  const n = Math.max(2, Math.round(pts.length * lerp(0.10, 0.20, k)));
  for (let i = 0; i < n; i++){
    const p = pts[Math.floor(Math.random() * pts.length)];
    const dx = sign * p.gx, dy = sign * p.gy;
    const rot = Math.atan2(dy, dx) - Math.PI / 2;
    const sc = lerp(0.13, 0.22, k) * rnd(0.85, 1.15);
    const al = lerp(0.50, 0.85, k) * rnd(0.8, 1.0);
    const si = Math.floor(Math.random() * SPR_N);
    const sxp = (si % SPR_COLS) * SPR_CW, syp = Math.floor(si / SPR_COLS) * SPR_CH;
    fctx.save();
    fctx.translate(p.x + tx, p.y + ty);
    fctx.rotate(rot);
    if (Math.random() < 0.5) fctx.scale(-1, 1);
    fctx.globalAlpha = al * 0.12;
    fctx.drawImage(shadowSheet, sxp, syp, SPR_CW, SPR_CH,
      -SPR_CW * sc / 2 + 0.4, -SPR_EDGE_Y * sc + 0.8, SPR_CW * sc, SPR_CH * sc);
    fctx.globalAlpha = al;
    fctx.drawImage(sheet, sxp, syp, SPR_CW, SPR_CH,
      -SPR_CW * sc / 2, -SPR_EDGE_Y * sc, SPR_CW * sc, SPR_CH * sc);
    fctx.restore();
  }
}

/* cut `drawMask(worldCtx)` out of a piece; returns cut-out piece or null */
function cutPiece(piece, drawMask, k, opts){
  opts = opts || {};
  const w = piece.bx.width, h = piece.bx.height;
  const maskCv = mkCanvas(w, h), mctx = maskCv.getContext("2d");
  mctx.save(); mctx.translate(-piece.x, -piece.y); drawMask(mctx); mctx.restore();

  const preData = alphaOf(piece.bx);
  let maskData = alphaOf(maskCv);
  let pts = cutBoundary(maskData, preData, w, h);
  let overlap = 0;
  for (let i = 3; i < maskData.length; i += 16)
    if (maskData[i] >= 128 && preData[i] > 10) overlap++;
  if (overlap < 12 && pts.length < 6) return { hit: false };

  roughenMask(mctx, pts, k);
  maskData = alphaOf(maskCv);
  pts = cutBoundary(maskData, preData, w, h);

  let cutout = null;
  if (!opts.discard){
    // bbox of removed material
    let mnx = 1e9, mny = 1e9, mxx = -1e9, mxy = -1e9, cnt = 0;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2){
      const i = (y * w + x) * 4 + 3;
      if (maskData[i] >= 128 && preData[i] > 10){
        cnt++;
        if (x < mnx) mnx = x; if (x > mxx) mxx = x;
        if (y < mny) mny = y; if (y > mxy) mxy = y;
      }
    }
    if (cnt > 24){
      const M = 20;
      mnx = Math.max(0, mnx - M); mny = Math.max(0, mny - M);
      mxx = Math.min(w, mxx + M); mxy = Math.min(h, mxy + M);
      const cw = mxx - mnx, ch = mxy - mny;
      const cbx = mkCanvas(cw, ch), cfx = mkCanvas(cw, ch);
      cbx.getContext("2d").drawImage(piece.bx, -mnx, -mny);
      cfx.getContext("2d").drawImage(piece.fx, -mnx, -mny);
      for (const c of [cbx, cfx]){
        const g = c.getContext("2d");
        g.globalCompositeOperation = "destination-in";
        g.drawImage(maskCv, -mnx, -mny);
        g.globalCompositeOperation = "source-over";
      }
      cutout = {
        bx: cbx, fx: cfx,
        x: piece.x + mnx, y: piece.y + mny,
        sx: 0, sy: 0, gx: 0, gy: 0,
      };
      stampFibers(cfx.getContext("2d"), pts, -1, k, -mnx, -mny);
    }
  }
  for (const c of [piece.bx, piece.fx]){
    const g = c.getContext("2d");
    g.globalAlpha = 1;
    g.globalCompositeOperation = "destination-out";
    g.drawImage(maskCv, 0, 0);
    g.globalCompositeOperation = "source-over";
  }
  stampFibers(piece.fx.getContext("2d"), pts, 1, k, 0, 0);
  return { hit: true, cutout };
}

/* apply a world-space mask cut to all pieces */
function cutAll(drawMask, k, slideFor){
  let anyHit = false;
  const newPieces = [];
  const survivors = [];
  for (const p of pieces){
    const res = cutPiece(p, drawMask, k, {});
    if (res.hit){
      anyHit = true;
      if (res.cutout){
        const s = slideFor ? slideFor(res.cutout) : { x: rnd(-4, 4), y: rnd(2, 6) };
        res.cutout.gx = s.x; res.cutout.gy = s.y;
        newPieces.push(res.cutout);
      }
    }
    survivors.push(p);
  }
  pieces = survivors.concat(newPieces);
  return anyHit;
}

/* ================= laying tape ================= */
function layTape(a, b){
  const L = dist(a.x, a.y, b.x, b.y);
  if (L < 30) return;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const M = 26;
  const cs = Math.cos(ang), sn = Math.sin(ang);
  const cor = [];
  for (const [u, v] of [[0,-TAPE_W/2],[L,-TAPE_W/2],[L,TAPE_W/2],[0,TAPE_W/2]])
    cor.push({ x: a.x + u*cs - v*sn, y: a.y + u*sn + v*cs });
  const mnx = Math.min(...cor.map(c=>c.x)) - M, mny = Math.min(...cor.map(c=>c.y)) - M;
  const mxx = Math.max(...cor.map(c=>c.x)) + M, mxy = Math.max(...cor.map(c=>c.y)) + M;
  const bx = mkCanvas(mxx-mnx, mxy-mny), fx = mkCanvas(mxx-mnx, mxy-mny);
  const g = bx.getContext("2d");
  g.save();
  g.translate(a.x - mnx, a.y - mny);
  g.rotate(ang);
  g.globalAlpha = 0.78;
  g.fillStyle = getPattern(currentDesign);
  g.fillRect(-6, -TAPE_W/2, L + 12, TAPE_W);   // slightly long; ends get torn off
  g.restore();

  pushUndo();
  const piece = { bx, fx, x: mnx, y: mny, sx: 0, sy: 0, gx: 0, gy: 0 };
  pieces.push(piece);

  // tear both ends off with the shared pipeline (scraps discarded)
  const kEnd = 0.55;
  const capMask = mctx => {
    mctx.save();
    mctx.translate(a.x, a.y);
    mctx.rotate(ang);
    mctx.fillStyle = "#fff";
    wobblyCap(mctx, 0, -1);
    wobblyCap(mctx, L, 1);
    mctx.restore();
  };
  cutPiece(piece, capMask, kEnd, { discard: true });
}
function wobblyCap(mctx, xBase, dir){
  mctx.beginPath();
  const w2 = TAPE_W/2 + 8;
  mctx.moveTo(xBase + dir * 40, -w2);
  let dx = rnd(-2, 2);
  const segs = 12;
  for (let i = 0; i <= segs; i++){
    const y = -w2 + (2*w2) * (i/segs);
    dx += rnd(-1, 1) * 2.4 - dx * 0.25;
    mctx.lineTo(xBase + dx, y);
  }
  mctx.lineTo(xBase + dir * 40, w2);
  mctx.closePath();
  mctx.fill();
}

/* ================= shapes & type ================= */
const PUNCH_R = 44;
function shapePath(g, shape, cx, cy, R){
  g.beginPath();
  if (shape === "circle"){
    g.arc(cx, cy, R, 0, 7);
  } else if (shape === "star"){
    for (let i = 0; i < 10; i++){
      const r = i % 2 === 0 ? R : R * 0.46;
      const a = -Math.PI/2 + i * Math.PI/5;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.closePath();
  } else if (shape === "heart"){
    const s = R / 16;
    g.moveTo(cx, cy + 12*s);
    g.bezierCurveTo(cx - 20*s, cy - 2*s, cx - 12*s, cy - 16*s, cx, cy - 7*s);
    g.bezierCurveTo(cx + 12*s, cy - 16*s, cx + 20*s, cy - 2*s, cx, cy + 12*s);
    g.closePath();
  }
}
const TYPE_SIZE = 74;
function typeMask(mctx, text, cx, cy){
  mctx.font = "bold " + TYPE_SIZE + "px Georgia, 'Times New Roman', serif";
  mctx.textBaseline = "middle";
  mctx.fillStyle = "#fff";
  const total = mctx.measureText(text).width;
  let x = cx - total / 2;
  for (const ch of text){
    const w = mctx.measureText(ch).width;
    mctx.save();
    mctx.translate(x + w/2, cy + rnd(-2.5, 2.5));
    mctx.rotate(rnd(-0.02, 0.02));
    mctx.fillText(ch, -w/2, 0);
    mctx.restore();
    x += w;
  }
}

function embossAll(drawShape){
  let any = false;
  for (const p of pieces){
    const w = p.bx.width, h = p.bx.height;
    const pre = alphaOf(p.bx);
    // does the shape overlap this piece?
    const test = mkCanvas(w, h), tg = test.getContext("2d");
    tg.save(); tg.translate(-p.x, -p.y); drawShape(tg); tg.restore();
    const td = alphaOf(test);
    let ov = 0;
    for (let i = 3; i < td.length; i += 24) if (td[i] > 128 && pre[i] > 10) ov++;
    if (ov < 10) continue;
    any = true;
    const g = p.bx.getContext("2d");
    // pressed shading: dark crescent (top-left), overall slight compression tint
    const cres = mkCanvas(w, h), cg = cres.getContext("2d");
    cg.save(); cg.translate(-p.x, -p.y); drawShape(cg); cg.restore();
    cg.globalCompositeOperation = "destination-out";
    cg.save(); cg.translate(1.6, 1.6); cg.translate(-p.x, -p.y); drawShape(cg); cg.restore();
    cg.globalCompositeOperation = "source-in";
    cg.fillStyle = "rgba(70,50,25,0.5)"; cg.fillRect(0, 0, w, h);
    g.save(); g.globalCompositeOperation = "source-atop";
    g.save(); g.translate(-p.x, -p.y); drawShape(g);
    g.fillStyle = "rgba(70,50,25,0.10)"; g.fill(); g.restore();
    g.drawImage(cres, 0, 0);
    g.restore();
    // highlight crescent (bottom-right) onto fiber layer, masked to tape
    const hi = mkCanvas(w, h), hg = hi.getContext("2d");
    hg.save(); hg.translate(-p.x, -p.y); drawShape(hg); hg.restore();
    hg.globalCompositeOperation = "destination-out";
    hg.save(); hg.translate(-1.6, -1.6); hg.translate(-p.x, -p.y); drawShape(hg); hg.restore();
    hg.globalCompositeOperation = "source-in";
    hg.fillStyle = "rgba(255,255,255,0.55)"; hg.fillRect(0, 0, w, h);
    hg.globalCompositeOperation = "destination-in";
    hg.drawImage(p.bx, 0, 0);
    p.fx.getContext("2d").drawImage(hi, 0, 0);
  }
  return any;
}

/* ================= pointer handling ================= */
let gesture = null, lastTap = null, hoverPos = null;

cv.addEventListener("pointermove", e => {
  const p = pos(e);
  hoverPos = p;
  if (!gesture || e.pointerId !== gesture.id) return;
  const now = performance.now();
  const prev = gesture.samples[gesture.samples.length - 1];
  if (dist(prev.x, prev.y, p.x, p.y) >= 1.2) gesture.samples.push({ ...p, t: now });

  if (gesture.kind === "move" && gesture.moveTape){
    if (!gesture.undoPushed){ pushUndo(); gesture.undoPushed = true; }
    gesture.moveTape.x += p.x - prev.x;
    gesture.moveTape.y += p.y - prev.y;
    gesture.moved = (gesture.moved || 0) + dist(prev.x, prev.y, p.x, p.y);
  }
  if (gesture.kind === "weight-drag"){
    weightBar.cx += p.x - prev.x;
    weightBar.cy += p.y - prev.y;
  }
  if (gesture.kind === "weight-rot"){
    weightBar.ang = Math.atan2(p.y - weightBar.cy, p.x - weightBar.cx);
  }
});

cv.addEventListener("pointerdown", e => {
  if (gesture) return;
  cv.setPointerCapture(e.pointerId);
  const p = pos(e);
  const now = performance.now();
  gesture = { id: e.pointerId, t0: now, samples: [{ ...p, t: now }], kind: mode };

  if (mode === "move"){
    gesture.kind = "move";
    gesture.moveTape = topPieceAt(p.x, p.y);
  } else if (mode === "weight"){
    const kn = knobPos();
    if (dist(p.x, p.y, kn.x, kn.y) < 22) gesture.kind = "weight-rot";
    else if (onBar(p.x, p.y)) gesture.kind = "weight-drag";
    else gesture.kind = "weight-flick";
  } else if (mode === "punch" || mode === "type"){
    gesture.kind = mode;
    gesture.pressAt = p;
  }
});

cv.addEventListener("pointerup", e => {
  if (!gesture || e.pointerId !== gesture.id) return;
  const p = pos(e);
  const now = performance.now();
  const dt = now - gesture.t0;
  const s = gesture.samples;

  if (gesture.kind === "tape"){
    layTape(s[0], p);
  }
  else if (gesture.kind === "punch"){
    const k = kFromHold(dt);
    pushUndo();
    const hit = cutAll(g => { g.fillStyle = "#fff"; shapePath(g, punchShape, p.x, p.y, PUNCH_R); g.fill(); }, k);
    if (hit) toasts.push({ x: p.x, y: p.y - PUNCH_R - 16, text: kLabel(k), born: now });
    else { undoStack.pop(); toasts.push({ x: p.x, y: p.y - 24, text: "press it on some tape", born: now }); }
  }
  else if (gesture.kind === "type"){
    const text = (typeTextValue || "").trim();
    if (text){
      const drawShape = g => { g.fillStyle = "#fff"; typeMask(g, text, p.x, p.y); };
      pushUndo();
      let hit;
      if (typeMode === "emboss") hit = embossAll(drawShape);
      else {
        const k = kFromHold(dt);
        hit = cutAll(drawShape, k);
        if (hit) toasts.push({ x: p.x, y: p.y - 62, text: kLabel(k), born: now });
      }
      if (!hit){ undoStack.pop(); toasts.push({ x: p.x, y: p.y - 24, text: "press it on some tape", born: now }); }
      else if (typeMode === "emboss") toasts.push({ x: p.x, y: p.y - 62, text: "pressed in", born: now });
    }
  }
  else if (gesture.kind === "weight-flick"){
    const d = dist(s[0].x, s[0].y, p.x, p.y);
    if (d > 40 && dt < 450){
      const speed = d / dt;
      const k = kFromSpeed(speed);
      weightFlick(s[0], k, now);
    }
  }
  else if (gesture.kind === "move" && (gesture.moved || 0) < 6){
    const hitT = topPieceAt(p.x, p.y);
    if (lastTap && now - lastTap.t < 350 && dist(lastTap.x, lastTap.y, p.x, p.y) < 26 && hitT){
      pushUndo();
      pieces = pieces.filter(q => q !== hitT);
      toasts.push({ x: p.x, y: p.y - 30, text: "removed", born: now });
      lastTap = null;
    } else lastTap = { x: p.x, y: p.y, t: now };
  }
  gesture = null;
});
cv.addEventListener("pointercancel", () => { gesture = null; });

function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function topPieceAt(x, y){
  for (let i = pieces.length - 1; i >= 0; i--){
    const p = pieces[i];
    const lx = Math.round(x - p.x - p.sx), ly = Math.round(y - p.y - p.sy);
    if (lx < 0 || ly < 0 || lx >= p.bx.width || ly >= p.bx.height) continue;
    const d = p.bx.getContext("2d").getImageData(lx, ly, 1, 1).data;
    if (d[3] > 20) return p;
  }
  return null;
}

/* ================= weight tool ================= */
function knobPos(){
  return {
    x: weightBar.cx + Math.cos(weightBar.ang) * (weightBar.len/2 + 30),
    y: weightBar.cy + Math.sin(weightBar.ang) * (weightBar.len/2 + 30),
  };
}
function onBar(x, y){
  const c = Math.cos(-weightBar.ang), s = Math.sin(-weightBar.ang);
  const dx = x - weightBar.cx, dy = y - weightBar.cy;
  const lx = dx*c - dy*s, ly = dx*s + dy*c;
  return Math.abs(lx) < weightBar.len/2 && Math.abs(ly) < weightBar.wdt/2 + 6;
}
function weightFlick(start, k, now){
  const ux = Math.cos(weightBar.ang), uy = Math.sin(weightBar.ang);
  let nx = -uy, ny = ux;
  const side = (start.x - weightBar.cx) * nx + (start.y - weightBar.cy) * ny;
  if (side < 0){ nx = -nx; ny = -ny; }
  const L2 = weightBar.len / 2, BIG = 2000;
  const p1 = { x: weightBar.cx - ux*L2, y: weightBar.cy - uy*L2 };
  const p2 = { x: weightBar.cx + ux*L2, y: weightBar.cy + uy*L2 };
  pushUndo();
  const hit = cutAll(g => {
    g.fillStyle = "#fff";
    g.beginPath();
    g.moveTo(p1.x, p1.y);
    g.lineTo(p2.x, p2.y);
    g.lineTo(p2.x + nx*BIG, p2.y + ny*BIG);
    g.lineTo(p1.x + nx*BIG, p1.y + ny*BIG);
    g.closePath();
    g.fill();
  }, k, () => ({ x: nx * 9 + rnd(-2, 2), y: ny * 9 + rnd(-2, 2) }));
  if (hit){
    toasts.push({ x: weightBar.cx + nx*40, y: weightBar.cy + ny*40, text: kLabel(k), born: now });
  } else undoStack.pop();
}

/* ================= rendering ================= */
function drawBackground(g, w, h){
  g.fillStyle = "#FBFAF6"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#E5E0D3";
  for (let y = 16; y < h; y += 22)
    for (let x = 16; x < w; x += 22){ g.beginPath(); g.arc(x, y, 0.9, 0, 7); g.fill(); }
}
function drawScene(g, w, h){
  drawBackground(g, w, h);
  for (const p of pieces){
    g.globalCompositeOperation = "multiply";
    g.drawImage(p.bx, p.x + p.sx, p.y + p.sy);
    g.globalCompositeOperation = "source-over";
    g.drawImage(p.fx, p.x + p.sx, p.y + p.sy);
  }
}
function drawWeight(g){
  if (mode !== "weight") return;
  const { cx, cy, ang, len, wdt } = weightBar;
  g.save();
  g.translate(cx, cy); g.rotate(ang);
  g.fillStyle = "rgba(60,40,20,0.14)";
  g.beginPath(); g.roundRect(-len/2 + 2, -wdt/2 + 4, len, wdt, 8); g.fill();
  const grad = g.createLinearGradient(0, -wdt/2, 0, wdt/2);
  grad.addColorStop(0, "#C79A6B"); grad.addColorStop(0.5, "#B98A5A"); grad.addColorStop(1, "#9A6E42");
  g.fillStyle = grad;
  g.beginPath(); g.roundRect(-len/2, -wdt/2, len, wdt, 8); g.fill();
  g.strokeStyle = "rgba(90,60,30,0.35)"; g.lineWidth = 1;
  for (let i = -2; i <= 2; i++){
    g.beginPath();
    g.moveTo(-len/2 + 14, i * 5.5 + rnd(-0.4, 0.4));
    g.bezierCurveTo(-len/6, i*5.5 + rnd(-2,2), len/6, i*5.5 + rnd(-2,2), len/2 - 14, i*5.5 + rnd(-0.4,0.4));
    g.stroke();
  }
  g.restore();
  const kn = knobPos();
  g.save();
  g.strokeStyle = "rgba(74,68,60,0.4)"; g.setLineDash([3,4]); g.lineWidth = 1;
  g.beginPath();
  g.moveTo(cx + Math.cos(ang)*len/2, cy + Math.sin(ang)*len/2);
  g.lineTo(kn.x, kn.y); g.stroke();
  g.setLineDash([]);
  g.beginPath(); g.arc(kn.x, kn.y, 9, 0, 7);
  g.fillStyle = "#fff"; g.fill();
  g.strokeStyle = "#4A443C"; g.lineWidth = 2; g.stroke();
  g.restore();
}
function drawGhost(g){
  if (mode !== "punch" && mode !== "type") return;
  const p = (gesture && (gesture.kind === "punch" || gesture.kind === "type"))
    ? gesture.samples[gesture.samples.length - 1] : hoverPos;
  if (!p) return;
  const holding = gesture && (gesture.kind === "punch" || gesture.kind === "type");
  const k = holding ? kFromHold(performance.now() - gesture.t0) : 1;
  g.save();
  g.globalAlpha = holding ? 0.6 : 0.35;
  g.fillStyle = "#4A443C";
  if (mode === "punch"){
    const R = PUNCH_R * (holding ? lerp(1, 0.94, 1 - k) : 1);
    shapePath(g, punchShape, p.x, p.y, R);
    g.fill();
  } else {
    const t = (typeTextValue || "").trim() || "…";
    g.font = "bold " + TYPE_SIZE + "px Georgia, 'Times New Roman', serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(t, p.x, p.y);
    g.textAlign = "left";
  }
  if (holding){
    g.globalAlpha = 1;
    g.font = "italic 13px Georgia, serif";
    g.fillStyle = "#7A6A50";
    g.textAlign = "center";
    g.fillText(kLabel(k), p.x, p.y + (mode === "punch" ? PUNCH_R + 26 : 62));
    g.textAlign = "left";
  }
  g.restore();
}
function drawToasts(g){
  const now = performance.now();
  toasts = toasts.filter(t => now - t.born < 1500);
  for (const t of toasts){
    const age = (now - t.born) / 1500;
    g.save();
    g.globalAlpha = age < 0.75 ? 1 : (1 - age) / 0.25;
    g.font = "italic 13px Georgia, serif";
    g.fillStyle = "#7A6A50";
    g.textAlign = "center";
    g.fillText(t.text, t.x, t.y - age * 12);
    g.restore();
  }
}
function frame(){
  for (const p of pieces){
    p.sx = lerp(p.sx, p.gx, 0.16);
    p.sy = lerp(p.sy, p.gy, 0.16);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScene(ctx, W, H);
  if (gesture && gesture.kind === "tape"){
    const s = gesture.samples, a = s[0], b = s[s.length - 1];
    if (dist(a.x, a.y, b.x, b.y) > 8){
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x));
      ctx.globalCompositeOperation = "multiply";
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = getPattern(currentDesign);
      ctx.fillRect(0, -TAPE_W/2, dist(a.x, a.y, b.x, b.y), TAPE_W);
      ctx.restore();
    }
  }
  drawWeight(ctx);
  drawGhost(ctx);
  drawToasts(ctx);
  requestAnimationFrame(frame);
}

/* ================= export ================= */
function savePNG(){
  const oc = mkCanvas(W * 2, H * 2);
  const g = oc.getContext("2d");
  g.setTransform(2, 0, 0, 2, 0, 0);
  drawScene(g, W, H);
  oc.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "maskingtape-tear-lab-02.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
}

/* ================= boot ================= */
sheet.onload = () => {
  shadowSheet = mkCanvas(sheet.width, sheet.height);
  const sg = shadowSheet.getContext("2d");
  sg.drawImage(sheet, 0, 0);
  sg.globalCompositeOperation = "source-in";
  sg.fillStyle = "#5A4628";
  sg.fillRect(0, 0, sheet.width, sheet.height);
  setMode("tape");
  requestAnimationFrame(frame);
};
sheet.src = SPRITE_SRC;
</script>
