<!DOCTYPE html>
<html lang="ja"><!-- JSで上書き -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フレームラボ — 手書き風SVG検証モック</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EE;
    --card:#FFFFFF;
    --ink:#4A443E;
    --ink-soft:#8A8178;
    --line:#E7E1D6;
    --accent:#C96F7B;
    --accent-soft:#F4E3E5;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Zen Maru Gothic",sans-serif;
    background:var(--paper);
    background-image:radial-gradient(rgba(74,68,62,.065) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    padding:28px 20px 60px;
  }
  .wrap{max-width:1060px; margin:0 auto;}

  header{margin-bottom:26px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  h1{font-weight:900; font-size:clamp(22px,3.4vw,30px); letter-spacing:.04em;}
  h1 .tape-mark{
    display:inline-block; background:var(--accent-soft); color:var(--accent);
    font-size:.55em; padding:3px 10px; border-radius:6px; vertical-align:middle;
    margin-left:10px; letter-spacing:.12em; transform:rotate(-2deg);
  }
  header p{color:var(--ink-soft); font-size:13px;}
  .lang-btn{
    margin-left:auto; font-family:inherit; font-weight:700; font-size:12px; letter-spacing:.1em;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft);
    border-radius:999px; padding:7px 16px; cursor:pointer; transition:all .12s ease;
  }
  .lang-btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1.5px);}

  .grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:22px; align-items:start;}
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:20px;
  }
  .card h2{
    font-size:13px; letter-spacing:.14em; color:var(--ink-soft); font-weight:700;
    margin-bottom:12px;
  }

  .preview-card{position:sticky; top:20px;}
  @media (max-width:820px){ .preview-card{position:static;} }
  .stage{
    background:repeating-linear-gradient(0deg, transparent, transparent 26px, rgba(74,68,62,.05) 26px, rgba(74,68,62,.05) 27px);
    border-radius:12px; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center; padding:14px;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .stage.cutmode{border-color:var(--accent); cursor:crosshair;}
  .stage svg{width:100%; height:auto; max-height:430px; display:block; overflow:visible;}
  .hit{fill:transparent; cursor:grab;}
  .dragging .hit{cursor:grabbing;}
  .cutmode .hit{cursor:crosshair;}
  .handle{fill:#fff; stroke:var(--accent); stroke-width:2; cursor:nwse-resize;}
  .selbox{fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:5 4; opacity:.85;}
  .cutmark{stroke:var(--accent); stroke-width:2.2; stroke-linecap:round;}
  .cuthit{fill:transparent; cursor:pointer;}
  .stage-foot{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px; flex-wrap:wrap;}
  .stage-foot .hint{font-size:12px; color:var(--ink-soft); line-height:1.75;}

  .ctrl{margin-bottom:20px;}
  .ctrl:last-child{margin-bottom:0;}
  .ctrl label.head{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-size:13px; font-weight:700; letter-spacing:.08em; margin-bottom:9px;
  }
  .ctrl label.head .val{color:var(--accent); font-weight:700; font-size:12px;}
  .ctrl .sub{font-size:11px; color:var(--ink-soft); font-weight:500; letter-spacing:0;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; border-radius:12px;
    padding:7px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-size:11px; color:var(--ink); min-width:64px;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .chip:hover{transform:translateY(-1.5px); border-color:var(--accent);}
  .chip svg{display:block; overflow:visible;}
  .chip.on{border-color:var(--accent); background:var(--accent-soft); font-weight:700;}
  .chip:focus-visible, button:focus-visible, input:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px;}
  .chips.compact .chip{min-width:0; padding:7px 12px; flex-direction:row;}

  .mini-btn{
    font-family:inherit; font-weight:700; font-size:11px; letter-spacing:.04em;
    border-radius:9px; padding:5px 10px; cursor:pointer; border:1.5px solid var(--line);
    background:#fff; color:var(--ink); transition:all .12s ease;
  }
  .mini-btn.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  input[type=range]{
    width:100%; appearance:none; height:6px; border-radius:3px;
    background:linear-gradient(90deg, var(--accent) var(--fill,50%), var(--line) var(--fill,50%));
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none; width:22px; height:22px; border-radius:50%;
    background:#fff; border:2.5px solid var(--accent); cursor:pointer;
    box-shadow:0 1px 4px rgba(74,68,62,.25);
  }
  input[type=range]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%;
    background:#fff; border:2.5px solid var(--accent); cursor:pointer;
  }

  .swatches{display:flex; gap:10px;}
  .swatch{
    width:34px; height:34px; border-radius:50%; cursor:pointer; border:2.5px solid transparent;
    box-shadow:inset 0 0 0 2px #fff; transition:transform .12s ease;
  }
  .swatch:hover{transform:scale(1.1);}
  .swatch.on{border-color:var(--ink);}

  input[type=text]{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px 14px;
    font-family:"Yomogi","Zen Maru Gothic",sans-serif; font-size:16px; color:var(--ink); background:#fff;
  }

  .btn-row{display:flex; gap:10px;}
  .btn{
    font-family:inherit; font-weight:700; font-size:13px; letter-spacing:.06em;
    border-radius:12px; padding:11px 16px; cursor:pointer; border:1.5px solid var(--line);
    background:#fff; color:var(--ink); transition:transform .12s ease;
  }
  .btn:hover{transform:translateY(-1.5px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}

  footer{margin-top:34px; text-align:center; color:var(--ink-soft); font-size:12px; letter-spacing:.06em;}
  footer .heart{color:var(--accent);}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="chipW" x="-40%" y="-40%" width="180%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div class="wrap">
  <header>
    <h1><span id="txtAppName"></span><span class="tape-mark" id="txtBadge"></span></h1>
    <p id="txtLead"></p>
    <button class="lang-btn" id="langBtn" type="button"></button>
  </header>

  <div class="grid">
    <!-- ================= preview ================= -->
    <div class="card preview-card">
      <h2 id="txtPreview"></h2>
      <div class="stage" id="stage"></div>
      <div class="stage-foot">
        <span class="hint" id="txtHint"></span>
        <div class="btn-row">
          <button class="btn" id="reroll"></button>
          <button class="btn primary" id="shuffle"></button>
        </div>
      </div>
    </div>

    <!-- ================= controls ================= -->
    <div class="card">
      <h2 id="txtCombine"></h2>

      <div class="ctrl">
        <label class="head"><span id="txtIconHead"></span> <span class="sub" id="txtIconSub"></span></label>
        <div class="chips" id="iconChips"></div>
      </div>

      <div class="ctrl">
        <label class="head">
          <span><span id="txtLineHead"></span> <span class="sub" id="lineTarget"></span></span>
          <button class="mini-btn" id="cutBtn" type="button"></button>
        </label>
        <div class="chips" id="lineChips"></div>
      </div>

      <div class="ctrl">
        <label class="head" id="txtShapeHead"></label>
        <div class="chips compact" id="shapeChips"></div>
      </div>

      <div class="ctrl">
        <label class="head"><span id="txtWobHead"></span> <span class="val" id="wobVal"></span></label>
        <input type="range" id="wob" min="0" max="100" value="55">
      </div>

      <div class="ctrl">
        <label class="head"><span id="txtSwHead"></span> <span class="val" id="swVal"></span></label>
        <input type="range" id="sw" min="10" max="40" value="20">
      </div>

      <div class="ctrl">
        <label class="head" id="txtInkHead"></label>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="ctrl">
        <label class="head" id="txtTextHead"></label>
        <input type="text" id="centerText" value="thank you ♡" maxlength="24">
      </div>
    </div>
  </div>

  <footer id="txtFooter"></footer>
</div>

<script>
"use strict";
/* ============================================================
   手書き風SVGフレーム 検証モック v4
   - 枠は周回パラメータ u(0..1)で管理。✂で切って区間ごとに線種を持つ
   - アイコンは線に「吸着(ドック)」する:
     線は常にまっすぐのまま、アイコン側が辺に沿って角度と位置を合わせる
     → 枠は四角のまま、入口/出口アンカーで線とつながる
============================================================ */

/* ---------- 乱数・ノイズ ---------- */
function hash(i, seed){
  const x = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function noise(t, seed){
  const i = Math.floor(t), f = t - i;
  const a = hash(i, seed), b = hash(i + 1, seed);
  const u = f * f * (3 - 2 * f);
  return (a + (b - a) * u) * 2 - 1;
}
function rnd(seed, k){ return hash(k * 7.31 + 13.7, seed); }
function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }
function lerpP(P0,P1,t){ return [P0[0]+(P1[0]-P0[0])*t, P0[1]+(P1[1]-P0[1])*t]; }
function normAng(a){ a=(a+180)%360; if(a<0)a+=360; return a-180; }

/* ---------- アイコン資産 ---------- */
const ICON_PATHS = {
diamond: `<path d="M23 39 L36.5 21 L63.5 21.5 L77 39 L50 79 Z"/><path d="M23 39 L77 39"/><path d="M36.5 21 L43 39"/><path d="M63.5 21.5 L57 39"/><path d="M43 39 L50 79"/><path d="M57 39 L50 79"/>`,
crown: `<path d="M24 58 L27.5 28 L38 45 L50 24.5 L62 45 L72.5 28 L76 58"/><path d="M23 58 L77 58 Q 78.5 64, 76.5 69 L23.5 69 Q 21.5 64, 23 58 Z"/><circle cx="27.5" cy="24" r="2.4" fill="__DOT__" stroke="none"/><circle cx="50" cy="20.5" r="2.4" fill="__DOT__" stroke="none"/><circle cx="72.5" cy="24" r="2.4" fill="__DOT__" stroke="none"/><circle cx="37" cy="63.5" r="1.5" fill="__DOT__" stroke="none"/><circle cx="50" cy="63.5" r="1.5" fill="__DOT__" stroke="none"/><circle cx="63" cy="63.5" r="1.5" fill="__DOT__" stroke="none"/>`,
ribbon: `<path d="M46 43 C 36 29, 19 28, 17 40 C 15 52, 33 55, 46 50"/><path d="M54 43 C 64 29, 81 28, 83 40 C 85 52, 67 55, 54 50"/><path d="M47 52 C 44 60, 40 69, 34 77 Q 39.5 76, 42 79 Q 46 68, 51 56"/><path d="M53 52 C 56 60, 60 69, 66 77 Q 60.5 76, 58 79 Q 54 68, 49 56"/><path d="M46 43 Q 50 39.5, 54 43 Q 57.5 46.5, 54 50 Q 50 53.5, 46 50 Q 42.5 46.5, 46 43 Z"/>`,
flower: `<g transform="translate(50 51)"><path transform="rotate(0)" d="M0 -9 C -10 -14, -14 -27, -6 -33 C -2 -36, 2 -36, 6 -33 C 14 -27, 10 -14, 0 -9 Z"/><path transform="rotate(71)" d="M0 -9 C -10 -14, -14 -27, -6 -33 C -2 -36, 2 -36, 6 -33 C 14 -27, 10 -14, 0 -9 Z"/><path transform="rotate(144)" d="M0 -9 C -10 -14, -14 -27, -6 -33 C -2 -36, 2 -36, 6 -33 C 14 -27, 10 -14, 0 -9 Z"/><path transform="rotate(215)" d="M0 -9 C -10 -14, -14 -27, -6 -33 C -2 -36, 2 -36, 6 -33 C 14 -27, 10 -14, 0 -9 Z"/><path transform="rotate(288)" d="M0 -9 C -10 -14, -14 -27, -6 -33 C -2 -36, 2 -36, 6 -33 C 14 -27, 10 -14, 0 -9 Z"/><path d="M0 -6.6 C 4 -6.8, 6.8 -3.6, 6.6 0 C 6.4 4, 3.6 6.6, 0 6.6 C -4 6.6, -6.6 3.6, -6.6 0 C -6.6 -4, -3.8 -6.4, 0 -6.6 Z"/></g>`,
star: `<path d="M50 18 Q 55.5 29, 58.2 40.7 Q 70 40.5, 82.3 41.5 Q 73.5 48.5, 63.3 56.3 Q 68 68, 70 79.5 Q 60.5 73.5, 50 66 Q 39.5 73.5, 30 79.5 Q 32 68, 36.7 56.3 Q 26.5 48.5, 17.7 41.5 Q 30 40.4, 41.8 40.7 Q 44.5 29, 50 18 Z"/>`,
heart: `<path d="M50 80 C 33 66, 17 55, 17 39 C 17 28, 25 20.5, 34 20.5 C 41 20.5, 47 25, 50 31 C 53 25, 59 20, 66 20 C 75 20, 83 28, 83 39 C 83 55, 67 66, 50 80 Z"/>`,
sparkle: `<g transform="translate(46 52)"><path transform="scale(0.86)" d="M0 -34 C 2 -12, 12 -2, 30 0 C 12 2, 2 12, 0 34 C -2 12, -12 2, -30 0 C -12 -2, -2 -12, 0 -34 Z"/><path transform="translate(31 -27) scale(0.28)" d="M0 -34 C 2 -12, 12 -2, 30 0 C 12 2, 2 12, 0 34 C -2 12, -12 2, -30 0 C -12 -2, -2 -12, 0 -34 Z"/><path transform="translate(25 24) scale(0.2)" d="M0 -34 C 2 -12, 12 -2, 30 0 C 12 2, 2 12, 0 34 C -2 12, -12 2, -30 0 C -12 -2, -2 -12, 0 -34 Z"/></g>`,
};
/* 線の入口/出口アンカー(100x100ローカル座標) */
const ICON_ANCHORS = {
  diamond:[[23,39],[77,39]],
  crown:[[23,63],[77,63]],
  ribbon:[[17,40],[83,40]],
  flower:[[15,51],[85,51]],
  star:[[17.7,41.5],[82.3,41.5]],
  heart:[[17,39],[83,39]],
  sparkle:[[20,52],[72,52]],
};
const ICON_KINDS = Object.keys(ICON_PATHS);
const LINES = ["plain","wave","dots","double","stitch"];
const STYLE_CHOICES = [...LINES, "none"];
const SHAPE_KEYS = ["wide","square","tall"];
const INKS = ["#4A443E","#C96F7B","#C29B45","#7E9B72","#6E93B4"];

/* ---------- 表示文言(日本語 / English) ---------- */
const I18N = {
ja:{
  htmlLang:"ja",
  docTitle:"フレームラボ — 手書き風SVG検証モック",
  appName:"フレームラボ",
  badge:"SVG検証モック",
  lead:"線とアイコンを組み合わせて、手書き風の枠をつくる",
  preview:"プレビュー",
  hint:"アイコン：ドラッグで移動、○つまみで大きさ。線に近づけると吸いついてつながります<br>線：タップで区間をえらぶ → 線種チップで切り替え",
  previewAria:"フレームのプレビュー",
  reroll:"🎲 描き直す",
  rerollTip:"同じ設定のまま線を描き直す",
  shuffle:"✨ おまかせ",
  combine:"くみあわせ",
  iconHead:"アイコンを置く",
  iconSub:"タップで追加",
  lineHead:"線のかたち",
  applyAll:"ぜんぶに適用",
  applySeg:"えらんだ区間に適用",
  cut:"✂️ カット",
  cutting:"✂️ カット中(線をタップ)",
  shapeHead:"枠のかたち",
  wobHead:"ゆらぎ",
  swHead:"線のふとさ",
  inkHead:"インクのいろ",
  inkAria:"インク: ",
  textHead:"まんなかの文字",
  footer:'maskingtape frame lab <span class="heart">♡</span> ぜんぶSVGで描画しています(画像素材ゼロ)',
  langBtn:"English",
  langTip:"Switch to English",
  icons:{diamond:"ダイヤ",crown:"おうかん",ribbon:"リボン",flower:"おはな",star:"ほし",heart:"ハート",sparkle:"きらり"},
  lines:{plain:"すっ",wave:"なみなみ",dots:"てんてん",double:"にじゅう",stitch:"ステッチ",none:"けす"},
  shapes:{wide:"よこ長",square:"ましかく",tall:"たて長"},
  inks:["すみ","べに","からし","まつ","はなだ"],
},
en:{
  htmlLang:"en",
  docTitle:"Frame Lab — hand-drawn SVG mockup",
  appName:"Frame Lab",
  badge:"SVG MOCKUP",
  lead:"Build a hand-drawn frame out of lines and little charms",
  preview:"Preview",
  hint:"Charms: drag to move, pull the ○ handle to resize. Bring one near a line and it snaps on.<br>Lines: tap a section, then pick a line style",
  previewAria:"Frame preview",
  reroll:"🎲 Redraw",
  rerollTip:"Redraw the lines with the same settings",
  shuffle:"✨ Surprise me",
  combine:"BUILD IT",
  iconHead:"Add a charm",
  iconSub:"tap to add",
  lineHead:"Line style",
  applyAll:"applies to all",
  applySeg:"applies to the selected part",
  cut:"✂️ Cut",
  cutting:"✂️ Cutting (tap a line)",
  shapeHead:"Frame shape",
  wobHead:"Wobble",
  swHead:"Line weight",
  inkHead:"Ink colour",
  inkAria:"Ink: ",
  textHead:"Text in the middle",
  footer:'maskingtape frame lab <span class="heart">♡</span> everything here is drawn as SVG (no image assets)',
  langBtn:"日本語",
  langTip:"日本語に切り替え",
  icons:{diamond:"Diamond",crown:"Crown",ribbon:"Ribbon",flower:"Flower",star:"Star",heart:"Heart",sparkle:"Sparkle"},
  lines:{plain:"Plain",wave:"Wavy",dots:"Dotted",double:"Double",stitch:"Stitch",none:"Erase"},
  shapes:{wide:"Wide",square:"Square",tall:"Tall"},
  inks:["Sumi","Rose","Mustard","Pine","Indigo"],
},
};
/* ?lang=en / ?lang=ja で切り替え。指定がなければブラウザの言語から推定 */
let LANG = (new URLSearchParams(location.search).get("lang")||"").toLowerCase().slice(0,2);
if(LANG!=="en" && LANG!=="ja"){
  LANG = (navigator.language||"ja").toLowerCase().startsWith("ja") ? "ja" : "en";
}
const T = ()=> I18N[LANG];
/* 辺ごとの基準角度(上・右・下・左)。上下は正立、左右は外を向く */
const DOCK_ANGLE = [0, 90, 0, -90];
const TILT_LIMIT = 10;   // 吸着中でも許す傾き

/* ---------- 状態 ---------- */
let nextId = 1;
const state = {
  wob:0.55, sw:2.0, ink:0, text:"thank you ♡", seed:7,
  shape:"wide", vw:420, vh:300,
  icons:[], selected:null,
  cuts:[], styles:["wave"],
  selSeg:null, cutMode:false,
};

/* ---------- 周回ジオメトリ ---------- */
function frameRect(){ const m=52; return {x:m,y:m,w:state.vw-2*m,h:state.vh-2*m}; }
function frameEdges(){
  const f=frameRect(), P=2*(f.w+f.h);
  const E=[
    {ax:f.x,     ay:f.y,     bx:f.x+f.w, by:f.y,     len:f.w, off:0},
    {ax:f.x+f.w, ay:f.y,     bx:f.x+f.w, by:f.y+f.h, len:f.h, off:f.w},
    {ax:f.x+f.w, ay:f.y+f.h, bx:f.x,     by:f.y+f.h, len:f.w, off:f.w+f.h},
    {ax:f.x,     ay:f.y+f.h, bx:f.x,     by:f.y,     len:f.h, off:2*f.w+f.h},
  ];
  E.forEach(e=>{ e.u0=e.off/P; e.u1=(e.off+e.len)/P; });
  return E;
}
function nearestPerimeter(x,y){
  let best=null;
  frameEdges().forEach((e,i)=>{
    const dx=(e.bx-e.ax)/e.len, dy=(e.by-e.ay)/e.len;
    const t=clamp((x-e.ax)*dx+(y-e.ay)*dy, 0, e.len);
    const px=e.ax+dx*t, py=e.ay+dy*t;
    const d=Math.hypot(x-px, y-py);
    if(!best || d<best.d) best={d, edge:i, u:e.u0+(t/e.len)*(e.u1-e.u0), px, py};
  });
  return best;
}
function styleAt(u){
  const {cuts, styles}=state;
  if(!cuts.length) return styles[0];
  u=((u%1)+1)%1;
  let idx=-1;
  for(let i=0;i<cuts.length;i++){ if(cuts[i]<=u) idx=i; }
  return styles[idx===-1 ? cuts.length-1 : idx];
}
function segIndexAt(u){
  const {cuts}=state;
  if(!cuts.length) return 0;
  u=((u%1)+1)%1;
  let idx=-1;
  for(let i=0;i<cuts.length;i++){ if(cuts[i]<=u) idx=i; }
  return idx===-1 ? cuts.length-1 : idx;
}
function addCut(u){
  const {cuts, styles}=state;
  if(!cuts.length){ state.cuts=[u]; state.styles=[styles[0]]; }
  else{
    let j=cuts.findIndex(c=>c>u); if(j===-1) j=cuts.length;
    const k=(j-1+cuts.length)%cuts.length;
    cuts.splice(j,0,u);
    styles.splice(j,0,styles[k]);
  }
  state.selSeg=null;
}
function removeCut(j){
  if(state.cuts.length<=1){ state.cuts=[]; state.styles=[state.styles[0]]; }
  else{ state.cuts.splice(j,1); state.styles.splice(j,1); }
  state.selSeg=null;
}
function segRanges(i){
  const {cuts}=state;
  if(!cuts.length) return [[0,1]];
  const a=cuts[i], b=cuts[(i+1)%cuts.length];
  return a<b ? [[a,b]] : [[a,1],[0,b]];
}

/* ---------- アイコンと吸着 ---------- */
function worldAnchor(pl, a){
  const k=pl.size/68, r=pl.rot*Math.PI/180;
  const lx=(a[0]-50)*k, ly=(a[1]-50)*k;
  return [pl.x+lx*Math.cos(r)-ly*Math.sin(r), pl.y+lx*Math.sin(r)+ly*Math.cos(r)];
}
/* 線に近ければ、辺に沿って角度をそろえ、アンカーが辺に乗るよう位置を補正 */
function applyDock(ic){
  const np=nearestPerimeter(ic.x, ic.y);
  if(np.d > Math.max(22, ic.size*0.72)){ ic.dock=null; return; }
  const e=frameEdges()[np.edge];
  const base=DOCK_ANGLE[np.edge];
  ic.rot = base + clamp(normAng(ic.rot-base), -TILT_LIMIT, TILT_LIMIT);
  ic.dock=np.edge;
  const dx=(e.bx-e.ax)/e.len, dy=(e.by-e.ay)/e.len;
  const nx=-dy, ny=dx;
  const A=ICON_ANCHORS[ic.kind];
  const p1=worldAnchor(ic,A[0]), p2=worldAnchor(ic,A[1]);
  const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
  const off=(mx-e.ax)*nx + (my-e.ay)*ny;   // 辺からのズレ
  ic.x-=nx*off; ic.y-=ny*off;              // アンカーを辺の上へ
}
function addIcon(kind, pos){
  const f=frameRect();
  const spots=[[.5,0],[0,0],[1,0],[1,1],[0,1],[.5,1],[0,.5],[1,.5]];
  let x,y;
  if(pos){ [x,y]=pos; }
  else{
    const a=spots[state.icons.length%spots.length];
    x=f.x+a[0]*f.w+(Math.random()-.5)*18;
    y=f.y+a[1]*f.h+(Math.random()-.5)*18;
  }
  const ic={ id:nextId++, kind,
    x:clamp(x,14,state.vw-14), y:clamp(y,14,state.vh-14),
    size:30, rot:(Math.random()-.5)*8, dock:null,
    seed:Math.floor(Math.random()*900)+1 };
  state.icons.push(ic);
  applyDock(ic);
  state.selected=ic.id;
  return ic;
}
function makeItem(pl){
  const A=ICON_ANCHORS[pl.kind];
  return { x:pl.x, y:pl.y, r:pl.size*0.6,
    aL:worldAnchor(pl,A[0]), aR:worldAnchor(pl,A[1]), dockKey:pl.dock };
}

/* ---------- 線 ---------- */
function wobblyPath(x1,y1,x2,y2, amp, seed, extraWave){
  const len=Math.hypot(x2-x1,y2-y1)||1;
  const n=Math.max(3, Math.round(len/7));
  const dx=(x2-x1)/len, dy=(y2-y1)/len, px=-dy, py=dx;
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    let off=noise(i*0.9,seed)*amp;
    if(extraWave){
      off+=Math.sin((t*len)/extraWave.wl*Math.PI*2+seed)*extraWave.amp*(1+noise(i*0.5,seed+9)*0.25);
    }
    const fade=Math.min(1, Math.min(t,1-t)/0.12);
    off*=0.3+0.7*fade;
    pts.push([x1+(x2-x1)*t+px*off, y1+(y2-y1)*t+py*off]);
  }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    d+=` Q${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const L=pts[pts.length-1];
  return d+` L${L[0].toFixed(1)},${L[1].toFixed(1)}`;
}

function styledSegment(x1,y1,x2,y2, style, cfg, seed){
  const {wob, sw, color}=cfg;
  const amp=wob*3.2;
  const len=Math.hypot(x2-x1,y2-y1);
  if(len<2 || style==="none") return "";
  const dx=(x2-x1)/len, dy=(y2-y1)/len, px=-dy, py=dx;
  const S=[];
  const stroke=`stroke="${color}" stroke-linecap="round" stroke-linejoin="round" fill="none"`;

  if(style==="plain"){
    S.push(`<path d="${wobblyPath(x1,y1,x2,y2,amp,seed)}" ${stroke} stroke-width="${sw}"/>`);
  }
  else if(style==="wave"){
    S.push(`<path d="${wobblyPath(x1,y1,x2,y2,amp*0.7,seed,{wl:15+wob*4,amp:2.6+wob*1.6})}" ${stroke} stroke-width="${sw}"/>`);
  }
  else if(style==="double"){
    const gap=sw*1.6+1.6;
    S.push(`<path d="${wobblyPath(x1+px*gap/2,y1+py*gap/2,x2+px*gap/2,y2+py*gap/2,amp,seed)}" ${stroke} stroke-width="${sw}"/>`);
    S.push(`<path d="${wobblyPath(x1-px*gap/2,y1-py*gap/2,x2-px*gap/2,y2-py*gap/2,amp,seed+41)}" ${stroke} stroke-width="${Math.max(1,sw*0.72)}"/>`);
  }
  else if(style==="dots"){
    const spacing=6+sw*2.6;
    const n=Math.max(1, Math.round(len/spacing));
    for(let i=0;i<=n;i++){
      const t=i/n;
      const jx=noise(i*1.3,seed)*amp*0.8, jy=noise(i*1.3,seed+5)*amp*0.8;
      const r=(sw*0.62)*(0.85+rnd(seed,i)*0.4);
      S.push(`<circle cx="${(x1+(x2-x1)*t+px*jx).toFixed(1)}" cy="${(y1+(y2-y1)*t+py*jy).toFixed(1)}" r="${r.toFixed(2)}" fill="${color}"/>`);
    }
  }
  else if(style==="stitch"){
    const dash=8, gapL=6.5;
    const n=Math.max(1, Math.floor((len+gapL)/(dash+gapL)));
    for(let i=0;i<n;i++){
      const t0=(i*(dash+gapL))/len, t1=Math.min(1,(i*(dash+gapL)+dash)/len), tm=(t0+t1)/2;
      const ang=noise(i*2.1,seed)*wob*0.28;
      const cX=x1+(x2-x1)*tm+px*noise(i,seed+3)*amp*0.7;
      const cY=y1+(y2-y1)*tm+py*noise(i,seed+3)*amp*0.7;
      const hl=(t1-t0)*len/2;
      const ddx=dx*Math.cos(ang)-dy*Math.sin(ang), ddy=dx*Math.sin(ang)+dy*Math.cos(ang);
      S.push(`<path d="M${(cX-ddx*hl).toFixed(1)},${(cY-ddy*hl).toFixed(1)} L${(cX+ddx*hl).toFixed(1)},${(cY+ddy*hl).toFixed(1)}" ${stroke} stroke-width="${sw}"/>`);
    }
  }
  return S.join("");
}

/* この辺の上でアイコンが線を中断する区間。
   吸着中 = アンカーに突き当てる / それ以外 = 円形にえぐる */
function interruptions(ax,ay,bx,by, runKey, items){
  const len=Math.hypot(bx-ax,by-ay)||1;
  const dx=(bx-ax)/len, dy=(by-ay)/len, px=-dy, py=dx;
  const list=[];
  for(const it of items){
    const vx=it.x-ax, vy=it.y-ay;
    const t=(vx*dx+vy*dy)/len;
    const d=Math.abs(vx*px+vy*py);
    if(it.dockKey===runKey){
      const tL=((it.aL[0]-ax)*dx+(it.aL[1]-ay)*dy)/len;
      const tR=((it.aR[0]-ax)*dx+(it.aR[1]-ay)*dy)/len;
      const [tIn,pIn,tOut,pOut]= tL<=tR ? [tL,it.aL,tR,it.aR] : [tR,it.aR,tL,it.aL];
      if(tOut<0||tIn>1) continue;
      list.push({tIn,pIn,tOut,pOut});
    }else if(d<it.r){
      const half=Math.sqrt(it.r*it.r-d*d)/len;
      if(t+half<0||t-half>1) continue;
      const c0=clamp(t-half,0,1), c1=clamp(t+half,0,1);
      list.push({
        tIn:t-half, pIn:[ax+(bx-ax)*c0, ay+(by-ay)*c0],
        tOut:t+half, pOut:[ax+(bx-ax)*c1, ay+(by-ay)*c1],
      });
    }
  }
  return list.sort((a,b)=>a.tIn-b.tIn);
}

function drawRun(ax,ay,bx,by, runKey, items, breaks, cfg, seedBase){
  const ints=interruptions(ax,ay,bx,by,runKey,items);
  const pieces=[];
  let curT=0, curP=[ax,ay];
  for(const it of ints){
    if(it.tIn>curT+0.003) pieces.push({t0:curT,t1:Math.min(it.tIn,1),P0:curP,P1:it.pIn});
    if(it.tOut>curT){ curT=Math.min(it.tOut,1); curP=it.pOut; }
    if(curT>=1) break;
  }
  if(curT<1) pieces.push({t0:curT,t1:1,P0:curP,P1:[bx,by]});

  let out="", k=0;
  for(const pc of pieces){
    const bts=breaks.filter(b=>b.t>pc.t0+0.004 && b.t<pc.t1-0.004);
    let s=pc.t0, Ps=pc.P0;
    let style=breaks.reduce((acc,b)=> b.t<=s+0.002 ? b.style : acc, breaks[0].style);
    for(const b of [...bts, {t:pc.t1, style:null}]){
      const Pe = b.t>=pc.t1 ? pc.P1 : lerpP(pc.P0,pc.P1,(b.t-pc.t0)/(pc.t1-pc.t0));
      out+=styledSegment(Ps[0],Ps[1],Pe[0],Pe[1], style, cfg, seedBase+k*17);
      k++;
      s=b.t; Ps=Pe; if(b.style!==null) style=b.style;
    }
  }
  return out;
}

function drawFrameLines(cfg, items){
  const ov=cfg.wob*3;
  let out="";
  frameEdges().forEach((e,i)=>{
    const dx=(e.bx-e.ax)/e.len, dy=(e.by-e.ay)/e.len;
    const o1=ov*rnd(state.seed,i*2), o2=ov*rnd(state.seed,i*2+1);
    const ax=e.ax-dx*o1, ay=e.ay-dy*o1, bx=e.bx+dx*o2, by=e.by+dy*o2;
    const extLen=e.len+o1+o2;
    const breaks=[{t:0, style:styleAt(e.u0+1e-6)}];
    for(const c of state.cuts){
      if(c>e.u0 && c<e.u1){
        const t=(((c-e.u0)/(e.u1-e.u0))*e.len+o1)/extLen;
        breaks.push({t, style:styleAt(c+1e-6)});
      }
    }
    out+=drawRun(ax,ay,bx,by, i, items, breaks, cfg, state.seed+i*13+1);
  });
  return out;
}

/* ---------- アイコン描画 ---------- */
function iconFilterDef(id, seed, wob){
  return `<filter id="${id}" x="-45%" y="-45%" width="190%" height="190%">`
       + `<feTurbulence type="fractalNoise" baseFrequency="0.085" numOctaves="2" seed="${seed}"/>`
       + `<feDisplacementMap in="SourceGraphic" scale="${(0.8+wob*2.4).toFixed(1)}" xChannelSelector="R" yChannelSelector="G"/>`
       + `</filter>`;
}
function iconSVG(kind, cx, cy, size, rot, filterId, cfg){
  const raw=ICON_PATHS[kind]; if(!raw) return "";
  const k=size/68;
  const swU=Math.max(1.1, cfg.sw)/k;
  const body=raw.split("__DOT__").join(cfg.color);
  return `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${rot.toFixed(1)})" filter="url(#${filterId})">`
       + `<g transform="scale(${k.toFixed(3)}) translate(-50,-50)" fill="none" stroke="${cfg.color}" stroke-width="${swU.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">${body}</g></g>`;
}

/* ---------- レンダリング ---------- */
function cfgFromState(){ return { wob:state.wob, sw:state.sw, color:INKS[state.ink] }; }
function escapeXML(s){ return s.replace(/[<>&"']/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c])); }

function renderPreview(){
  const {vw,vh}=state;
  const cfg=cfgFromState();
  const items=state.icons.map(makeItem);
  const defs=state.icons.map(ic=>iconFilterDef("f"+ic.id, ic.seed, state.wob)).join("");

  let selHi="";
  if(state.selSeg!==null){
    const edges=frameEdges();
    for(const [ra,rb] of segRanges(state.selSeg)){
      for(const e of edges){
        const a=Math.max(ra,e.u0), b=Math.min(rb,e.u1);
        if(a>=b) continue;
        const t0=(a-e.u0)/(e.u1-e.u0), t1=(b-e.u0)/(e.u1-e.u0);
        selHi+=`<line x1="${(e.ax+(e.bx-e.ax)*t0).toFixed(1)}" y1="${(e.ay+(e.by-e.ay)*t0).toFixed(1)}"
                 x2="${(e.ax+(e.bx-e.ax)*t1).toFixed(1)}" y2="${(e.ay+(e.by-e.ay)*t1).toFixed(1)}"
                 stroke="#C96F7B" stroke-opacity=".26" stroke-width="${state.sw+9}" stroke-linecap="round"/>`;
      }
    }
  }

  const lines=drawFrameLines(cfg, items);
  const icons=state.icons.map(ic=>iconSVG(ic.kind,ic.x,ic.y,ic.size,ic.rot,"f"+ic.id,cfg)).join("");
  const hits=state.icons.map(ic=>
    `<circle class="hit" data-icon="${ic.id}" cx="${ic.x}" cy="${ic.y}" r="${(ic.size*0.55).toFixed(1)}"/>`).join("");

  const text=state.text
    ? `<text x="${vw/2}" y="${vh/2}" text-anchor="middle" dominant-baseline="middle" pointer-events="none"
        font-family="Yomogi, sans-serif" font-size="27" fill="${cfg.color}">${escapeXML(state.text)}</text>`:"";

  let sel="";
  const s=state.icons.find(i=>i.id===state.selected);
  if(s){
    const h=s.size*0.62, rad=s.rot*Math.PI/180;
    const hx=s.x+(h*Math.cos(rad)-h*Math.sin(rad));
    const hy=s.y+(h*Math.sin(rad)+h*Math.cos(rad));
    sel=`<g pointer-events="none"><rect class="selbox" x="${(s.x-h).toFixed(1)}" y="${(s.y-h).toFixed(1)}"
           width="${(h*2).toFixed(1)}" height="${(h*2).toFixed(1)}" rx="4"
           transform="rotate(${s.rot.toFixed(1)} ${s.x.toFixed(1)} ${s.y.toFixed(1)})"/></g>
         <circle class="handle" data-handle="1" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="7"/>`;
  }

  let marks="";
  if(state.cutMode){
    const edges=frameEdges();
    state.cuts.forEach((c,j)=>{
      const e=edges.find(e=>c>=e.u0&&c<e.u1)||edges[edges.length-1];
      const t=(c-e.u0)/(e.u1-e.u0);
      const x=e.ax+(e.bx-e.ax)*t, y=e.ay+(e.by-e.ay)*t;
      const dx=(e.bx-e.ax)/e.len, dy=(e.by-e.ay)/e.len;
      marks+=`<g><line class="cutmark" x1="${(x+dy*8).toFixed(1)}" y1="${(y-dx*8).toFixed(1)}"
               x2="${(x-dy*8).toFixed(1)}" y2="${(y+dx*8).toFixed(1)}"/>
             <circle class="cuthit" data-cut="${j}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/></g>`;
    });
  }

  document.getElementById("stage").innerHTML=
    `<svg id="pv" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="${T().previewAria}">
       <defs>${defs}</defs>
       <g pointer-events="none">${selHi}${lines}${icons}${text}</g>
       ${hits}${sel}${marks}
     </svg>`;
}

let raf=null;
function renderAll(){
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=null; renderPreview(); syncLineChips(); });
}

/* ---------- ポインタ操作 ---------- */
const stage=document.getElementById("stage");
let drag=null;
function toSVG(evt){
  const svg=document.getElementById("pv");
  const pt=svg.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

stage.addEventListener("pointerdown", e=>{
  const t=e.target;
  if(t.dataset && t.dataset.cut!==undefined){
    removeCut(+t.dataset.cut); renderAll(); e.preventDefault(); return;
  }
  if(t.dataset && t.dataset.handle){
    const ic=state.icons.find(i=>i.id===state.selected);
    if(!ic) return;
    const p=toSVG(e);
    drag={mode:"transform", ic,
      d0:Math.hypot(p.x-ic.x,p.y-ic.y)||1,
      a0:Math.atan2(p.y-ic.y,p.x-ic.x),
      s0:ic.size, r0:ic.rot};
    stage.classList.add("dragging"); e.preventDefault(); return;
  }
  if(t.dataset && t.dataset.icon && !state.cutMode){
    const ic=state.icons.find(i=>i.id===+t.dataset.icon);
    state.selected=ic.id; state.selSeg=null;
    const p=toSVG(e);
    drag={mode:"move", ic, ox:p.x-ic.x, oy:p.y-ic.y};
    stage.classList.add("dragging"); renderAll(); e.preventDefault(); return;
  }
  const p=toSVG(e);
  const np=nearestPerimeter(p.x,p.y);
  if(state.cutMode){
    if(np.d<14){ addCut(np.u); renderAll(); }
    return;
  }
  if(np.d<12){
    state.selSeg=segIndexAt(np.u); state.selected=null; renderAll(); return;
  }
  if(state.selected!==null||state.selSeg!==null){ state.selected=null; state.selSeg=null; renderAll(); }
});
window.addEventListener("pointermove", e=>{
  if(!drag) return;
  const p=toSVG(e);
  if(drag.mode==="move"){
    drag.ic.x=clamp(p.x-drag.ox,12,state.vw-12);
    drag.ic.y=clamp(p.y-drag.oy,12,state.vh-12);
  }else{
    const d=Math.hypot(p.x-drag.ic.x,p.y-drag.ic.y);
    const a=Math.atan2(p.y-drag.ic.y,p.x-drag.ic.x);
    drag.ic.size=clamp(drag.s0*(d/drag.d0),14,96);
    drag.ic.rot=drag.r0+(a-drag.a0)*180/Math.PI;
  }
  applyDock(drag.ic);
  renderAll();
});
window.addEventListener("pointerup", ()=>{ drag=null; stage.classList.remove("dragging"); });

/* ---------- UI ---------- */
function miniLineSVG(kind){
  if(kind==="none")
    return `<svg width="52" height="16" viewBox="0 0 52 16"><path d="M6,8 H46" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 6" opacity=".4" fill="none"/></svg>`;
  const cfg={wob:.5, sw:1.8, color:"currentColor"};
  return `<svg width="52" height="16" viewBox="0 0 52 16">${styledSegment(3,8,49,8,kind,cfg,kind.length*13+5)}</svg>`;
}
function miniIconSVG(kind){
  const k=22/68, sw=(1.5/k).toFixed(1);
  const body=ICON_PATHS[kind].split("__DOT__").join("currentColor");
  return `<svg width="26" height="26" viewBox="-13 -13 26 26"><g filter="url(#chipW)"><g transform="scale(${k.toFixed(3)}) translate(-50,-50)" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${body}</g></g></svg>`;
}

/* --- チップ類(言語切替で作り直す) --- */
function buildIconChips(){
  const el=document.getElementById("iconChips"); el.innerHTML="";
  ICON_KINDS.forEach(kind=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button";
    b.innerHTML=miniIconSVG(kind)+`<span>${T().icons[kind]}</span>`;
    b.addEventListener("click",()=>{ addIcon(kind); renderAll(); });
    el.appendChild(b);
  });
}
function buildLineChips(){
  const el=document.getElementById("lineChips"); el.innerHTML="";
  STYLE_CHOICES.forEach(kind=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.dataset.val=kind;
    b.innerHTML=miniLineSVG(kind)+`<span>${T().lines[kind]}</span>`;
    b.addEventListener("click",()=>{
      if(state.selSeg!==null) state.styles[state.selSeg]=kind;
      else state.styles=state.styles.map(()=>kind);
      renderAll();
    });
    el.appendChild(b);
  });
}
function syncLineChips(){
  const el=document.getElementById("lineChips");
  let cur=null;
  if(state.selSeg!==null) cur=state.styles[state.selSeg];
  else if(state.styles.every(s=>s===state.styles[0])) cur=state.styles[0];
  [...el.children].forEach(c=>c.classList.toggle("on", c.dataset.val===cur));
  document.getElementById("lineTarget").textContent=
    state.selSeg!==null ? T().applySeg : T().applyAll;
}

function setShape(v){
  const old={vw:state.vw, vh:state.vh};
  state.shape=v;
  [state.vw,state.vh]= v==="wide"?[420,300] : v==="square"?[360,340] : [300,380];
  state.icons.forEach(ic=>{
    ic.x=clamp(ic.x/old.vw*state.vw,12,state.vw-12);
    ic.y=clamp(ic.y/old.vh*state.vh,12,state.vh-12);
    applyDock(ic);
  });
}
function buildShapeChips(){
  const el=document.getElementById("shapeChips"); el.innerHTML="";
  SHAPE_KEYS.forEach(v=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.dataset.val=v;
    b.innerHTML=`<span>${T().shapes[v]}</span>`;
    b.addEventListener("click",()=>{ setShape(v); syncShapeChips(); renderAll(); });
    el.appendChild(b);
  });
  syncShapeChips();
}
function syncShapeChips(){
  const el=document.getElementById("shapeChips");
  [...el.children].forEach(c=>c.classList.toggle("on", c.dataset.val===state.shape));
}

function buildSwatches(){
  const el=document.getElementById("swatches"); el.innerHTML="";
  INKS.forEach((hex,idx)=>{
    const b=document.createElement("button");
    b.className="swatch"; b.type="button"; b.style.background=hex;
    b.title=T().inks[idx]; b.setAttribute("aria-label", T().inkAria+T().inks[idx]);
    b.addEventListener("click",()=>{ state.ink=idx; syncSwatches(); renderAll(); });
    el.appendChild(b);
  });
  syncSwatches();
}
function syncSwatches(){
  const el=document.getElementById("swatches");
  [...el.children].forEach((c,i)=>c.classList.toggle("on", i===state.ink));
}

/* --- ハサミ --- */
const cutBtn=document.getElementById("cutBtn");
cutBtn.addEventListener("click",()=>{
  state.cutMode=!state.cutMode;
  state.selSeg=null; state.selected=null;
  cutBtn.classList.toggle("on", state.cutMode);
  stage.classList.toggle("cutmode", state.cutMode);
  cutBtn.textContent = state.cutMode ? T().cutting : T().cut;
  renderAll();
});

/* --- スライダー --- */
function bindRange(id, valId, get, set, fmt){
  const el=document.getElementById(id), lab=document.getElementById(valId);
  const upd=()=>{ lab.textContent=fmt(get()); el.style.setProperty("--fill",(el.value-el.min)/(el.max-el.min)*100+"%"); };
  el.addEventListener("input",()=>{ set(+el.value); state.icons.forEach(applyDock); upd(); renderAll(); });
  upd(); return upd;
}
const updWob=bindRange("wob","wobVal", ()=>state.wob*100, v=>state.wob=v/100, v=>Math.round(v)+"%");
bindRange("sw","swVal", ()=>state.sw*10, v=>state.sw=v/10, v=>(v/10).toFixed(1)+"px");

document.getElementById("centerText").addEventListener("input", e=>{ state.text=e.target.value; renderAll(); });

document.getElementById("reroll").addEventListener("click",()=>{
  state.seed=Math.floor(Math.random()*9999);
  state.icons.forEach(ic=>{ ic.seed=Math.floor(Math.random()*900)+1; });
  renderAll();
});
document.getElementById("shuffle").addEventListener("click",()=>{
  state.ink=Math.floor(Math.random()*INKS.length);
  state.wob=0.3+Math.random()*0.6;
  state.seed=Math.floor(Math.random()*9999);
  state.styles=state.styles.map(()=> LINES[Math.floor(Math.random()*LINES.length)]);
  state.icons.forEach(ic=>{
    ic.rot+=(Math.random()-.5)*16;
    ic.seed=Math.floor(Math.random()*900)+1;
    applyDock(ic);
  });
  document.getElementById("wob").value=Math.round(state.wob*100);
  syncShapeChips(); syncSwatches(); updWob(); renderAll();
});

/* ---------- 言語の適用と切り替え ---------- */
function applyLang(){
  const L=T();
  document.documentElement.lang=L.htmlLang;
  document.title=L.docTitle;
  const set=(id,txt)=>{ document.getElementById(id).textContent=txt; };
  const setHTML=(id,html)=>{ document.getElementById(id).innerHTML=html; };
  set("txtAppName", L.appName);
  set("txtBadge", L.badge);
  set("txtLead", L.lead);
  set("txtPreview", L.preview);
  setHTML("txtHint", L.hint);
  set("txtCombine", L.combine);
  set("txtIconHead", L.iconHead);
  set("txtIconSub", L.iconSub);
  set("txtLineHead", L.lineHead);
  set("txtShapeHead", L.shapeHead);
  set("txtWobHead", L.wobHead);
  set("txtSwHead", L.swHead);
  set("txtInkHead", L.inkHead);
  set("txtTextHead", L.textHead);
  setHTML("txtFooter", L.footer);

  const rr=document.getElementById("reroll");
  rr.textContent=L.reroll; rr.title=L.rerollTip;
  document.getElementById("shuffle").textContent=L.shuffle;
  cutBtn.textContent = state.cutMode ? L.cutting : L.cut;
  const lb=document.getElementById("langBtn");
  lb.textContent=L.langBtn; lb.title=L.langTip;

  buildIconChips(); buildLineChips(); buildShapeChips(); buildSwatches();
  renderAll();
}
document.getElementById("langBtn").addEventListener("click",()=>{
  LANG = (LANG==="ja") ? "en" : "ja";
  const url=new URL(location.href);
  url.searchParams.set("lang", LANG);
  history.replaceState(null, "", url);
  applyLang();
});

/* ---------- 初期状態 ---------- */
(function init(){
  const f=frameRect();
  addIcon("crown",  [f.x+f.w*0.32, f.y]);
  addIcon("diamond",[f.x+f.w, f.y+f.h*0.42]);
  addIcon("heart",  [f.x+f.w*0.62, f.y+f.h]);
  addIcon("star",   [f.x, f.y+f.h*0.55]);
  addIcon("sparkle",[f.x+f.w*0.86, f.y]);
  state.selected=null;
  const P=2*(f.w+f.h);
  state.cuts=[(f.w+f.h)/P, (2*f.w+f.h)/P];
  state.styles=["dots","wave"];
  applyLang();
})();
</script>
